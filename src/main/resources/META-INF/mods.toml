[[mods]]
modId="material_generators"
version="1.0.0"
displayName="Material Generators"
description='''
Tiered generator blocks that slowly produce Create zinc, nether quartz and every vanilla wood type.
'''

[[dependencies.material_generators]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.material_generators]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Create is optional: without it the zinc generators exist but stay idle and their recipes are disabled.
[[dependencies.material_generators]]
    modId="create"
    mandatory=false
    versionRange="[0.5.1,)"
    ordering="AFTER"
    side="BOTH"
